<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTC Dashboard</title>
    <link rel="stylesheet" href="/assets/main.css">
</head>
<body>
    <header class="main-header">
        <div class="logo">
            <img src="/assets/utc.png">
            <span id="page-label" style="font-weight: bold; margin-left: 16px">Dashboard</span>
        </div>
    </header>
    <div id="main-container" class="main-container">
        <div id="sidebar" class="sidebar">
            <div class="sidebar-item collapse-item" onclick="toggleSidebar()">
                <img id="sidebar-collapse-icon" class="sidebar-icon" src="/assets/icons/silk-svg/Application side collapse.svg"><span class="sidebar-label">Hide Sidebar</span>
            </div>
            <div id="sidebar-items">
                <div class="sidebar-item selected">
                    <img class="sidebar-icon" src="/assets/icons/silk-svg/Door in.svg">
                    <span class="sidebar-label">Log In</span>
                </div>
            </div>
        </div>
        <div id="content" class="content">
            Content
        </div>
        <footer class="footer">
            <center style="margin-top: 1em;">
                Umali Tours Corporation Dashboard<br>
                Copyright &copy; 2026. All Rights Reserved.
            </center>
        </footer>
    </div>
    <script src="/assets/main.js">
    </script>
</body>
</html>
