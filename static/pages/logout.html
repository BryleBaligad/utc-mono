<!DOCTYPE html>
<html lang="en">
<style>
    .page-content {
        padding-top: 16px;
        padding-left: 12px;
    }
    
    .bigtext {
        font-size: x-large;
        font-weight: bold;
    }

    #subtitle {
        font-size: smaller;
    }
</style>

<body>
    <div class="page-content">
        <span class="bigtext">Log Out</span><br>
        <span id="subtitle">Are you sure you want to log out?</span><br><br>
        <div id="logoutButton" class="action">
            <img class="action-icon" src="/assets/icons/silk-svg/Door out.svg"><span>Log out</span>
        </div>
    </div>
    <script>
        document.getElementById("logoutButton").onclick = () => {
            fetch("/api/v1/sessions", {
                method: "DELETE"
            }).then(async res => {
                if (await res.text()) {
                    generateSidebarByRole("")
                }
            })
        }
    </script>
</body>

</html>
