<!DOCTYPE html>
<html lang="en">
<style>
    .page-content {
        padding-top: 16px;
        padding-left: 12px;
    }
    
    .bigtext {
        font-size: x-large;
        font-weight: bold;
    }
</style>

<body>
    <div class="page-content">
        <span class="bigtext">Fleet</span><br><br>
        <table id="accountsTable">
            <tr>
                <th>Image</th>
                <th>Vehicle ID</th>
                <th>Plate Number</th>
                <th>Make/Model</th>
                <th>Type</th>
                <th>Actions</th>
            </tr>
        </table>
        <br>
        <button class="action" onmousedown="openVehicleCreationWindow()">
            <img class="action-icon" src="/assets/icons/silk-svg/Car add.svg"><span>Create New Vehicle</span>
        </button>
    </div>
</body>

</html>
