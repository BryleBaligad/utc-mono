<!DOCTYPE html>
<html lang="en">
<style>
    .page-content {
        padding-top: 16px;
        padding-left: 12px;
    }
    
    .bigtext {
        font-size: x-large;
        font-weight: bold;
    }

    .mediumtext {
        font-size: medium;
        font-weight: bold;
    }
</style>

<body>
    <div class="page-content">
        <span class="bigtext">Trip Assignments</span> &nbsp; 
        <button class="action" onmousedown="load()">
            <img class="action-icon" src="/assets/icons/silk-svg/Arrow Rotate CW.svg"><span>Refresh</span>
        </button><br><br>
        <table id="tripsTable">
            <tr>
                <th>Trip ID</th>
                <th>Status</th>
                <th>Booking Detail</th>
                <th>Start</th>
                <th>End</th>
                <th>Customer</th>
                <th>Vehicle</th>
                <th>Amount Due</th>
                <th>Actions</th>
            </tr>
        </table>
    </div>
    <script>
        function load() {
            fetch(`/api/v1/trips`).then(async res => {
                if (res.status == 403) {
                    generateSidebarByRole("");
                    return;
                }

                document.querySelectorAll("#tripsTable > :not(:first-child)").forEach(element => element.remove())

                let json = await res.json();
                for (let i = 0; i < json.length; i++) {
                    const trip = json[i];
                    console.log(trip)
                    await addTripsToTableRow(trip.id, trip.status, trip.booking_type, trip.start_at, trip.end_at, trip.start_location || "", trip.end_location || "", trip.service_type, trip.service_subtype, trip.account_id, trip.vehicle_id, trip.extra_fields)
                }
            })
        }

        load()

        async function addTripsToTableRow(id, status, bookingType, startAt = "", endAt = "", startLocation = "", endLocation = "", serviceType, serviceSubtype, accountID, vehicleID, extraFields) {
            let tripsTable = document.getElementById("tripsTable");
            let row = document.createElement("tr");

            let idCell = document.createElement("td");
            idCell.innerText = `UTC-${id.toString().padStart(5, "0")}`;

            let statusCell = document.createElement("td");
            statusCell.innerText = status;
            switch (status) {
                case "NEGOTIATING": statusCell.style.backgroundColor = "#00c3ff"; break;
                case "CONFIRMED": statusCell.style.backgroundColor = "yellow"; break;
                case "COMPLETED": statusCell.style.backgroundColor = "lime"; break;
                case "CANCELLED": statusCell.style.backgroundColor = "red"; break;
            }

            let bookingDetailCell = document.createElement("td");
            bookingDetailCell.innerText = `${bookingType}\n${serviceType}\n${serviceSubtype}`;

            let startDetailCell = document.createElement("td");
            startDetailCell.innerText = `${startLocation}\n${startAt ? new Date(startAt).toLocaleString("en-US").replace(", ", "\n") : ""}`;

            let endDetailCell = document.createElement("td");
            endDetailCell.innerText = `${endLocation}\n${endAt ? new Date(endAt).toLocaleString("en-US").replace(", ", "\n") : ""}`;

            let accountCell = document.createElement("td");
            let customer;
            if (!accountID) {
                accountCell.innerText = "None"
            } else {
                customer = await (await fetch(`/api/v1/accounts/${accountID}`)).json()
                if (customer.account_details) {
                    accountCell.innerText = `${customer.account_details.first_name} ${customer.account_details.middle_name} ${customer.account_details.last_name}\n${customer.account_details.mobile_number}`;
                } else {
                    accountCell.innerText = `Account ID ${customer.id}`;
                }
            }

            let vehicleCell = document.createElement("td");
            if (!vehicleID) {
                vehicleCell.innerText = "None"
            } else {
                let vehicle = await (await fetch(`/api/v1/vehicles/${vehicleID}`)).json()
                vehicleCell.innerText = `${vehicle.make_model}\n${vehicle.type}, ${vehicle.plate_number}`;
            }

            let amountDueCell = document.createElement("td");
            amountDueCell.innerText = "None"
            let amountDue = 0;
            let paymentType = "N/A";
            if (extraFields) {
                if (typeof extraFields != "object") {
                    extraFields = JSON.parse(extraFields)
                }

                paymentType = extraFields.payment?.type;
                amountDue = (parseFloat(extraFields.payment.amount) || 0 - parseFloat(extraFields.payment.paid) || 0)
                if (amountDue > 0) {
                    amountDueCell.innerText = `₱${amountDue.toFixed(2)}`
                }
            }

            let actionsCell = document.createElement("td");
            let markPaidAction = document.createElement("div");
            markPaidAction.className = "action";
            markPaidAction.onmousedown = () => { markPaid(id, amountDue, customer, paymentType, extraFields) }

            let markPaidActionIcon = document.createElement("img");
            markPaidActionIcon.className = "action-icon";
            markPaidActionIcon.src = "/assets/icons/silk-svg/Money.svg";

            let markPaidActionLabel = document.createElement("span");
            markPaidActionLabel.innerText = "Mark Paid";

            markPaidAction.append(markPaidActionIcon, markPaidActionLabel);

            if (amountDue > 0) {
                actionsCell.append(markPaidAction);
            }

            row.append(idCell, statusCell, bookingDetailCell, startDetailCell, endDetailCell, accountCell, vehicleCell, amountDueCell, actionsCell);

            tripsTable.append(row);
        }

        function markPaid(id, amountDue, customer, paymentType, extraFields) {
            if (confirm(`Are you sure you want to mark Trip UTC-${id.toString().padStart(5, "0")} as paid?\n\nPlease ensure ${customer.account_details.first_name} ${customer.account_details.middle_name} ${customer.account_details.last_name} has fully paid you ₱${amountDue.toFixed(2)} via ${paymentType}.`)) {
                if (typeof extraFields != "object") {
                    extraFields = JSON.parse(extraFields)
                }

                if (!extraFields.payment) {
                    extraFields.payment = {}
                }

                extraFields.payment.status = "FULLY PAID";
                extraFields.payment.paid = extraFields.payment.amount

                let reqJson = {
                    extra_fields: JSON.stringify(extraFields)
                }
                
                fetch(`/api/v1/trips/${id}`, {
                    method: "PATCH",
                    body: reqJson
                }).then(res => {
                    if (res.status == 200) {
                        alert("Successfully marked trip as fully paid.")
                    }
                })
            }
        }
    </script>
</body>

</html>
