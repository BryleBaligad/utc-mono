<!DOCTYPE html>
<html lang="en">
<style>
    .page-content {
        padding-top: 16px;
        padding-left: 12px;
    }
    
    .bigtext {
        font-size: x-large;
        font-weight: bold;
    }

    .label {
        font-size: smaller;
        display: inline-block;
        margin-top: 8px;
    }

    #subtitle {
        font-size: smaller;
        font-weight: bold;
        color: red;
    }
</style>

<body>
    <div class="page-content">
        <span class="bigtext">Log in</span><br>
        <span id="subtitle"></span><br>
        <form id="loginForm" onsubmit="handleLogin(); return false;">
            <label class="label" for="usernameInput">Username</label><br>
            <input id="usernameInput" name="username" required><br>
    
            <label class="label" for="passwordInput">Password</label><br>
            <input id="passwordInput" name="password" type="password" required><br><br>
            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        let loginCalled = false;
        async function handleLogin() {
            if (loginCalled) return;
            loginCalled = true;

            document.getElementById("subtitle").innerText = ""

            let formData = new FormData(document.getElementById("loginForm"));

            let res = await fetch("/api/v1/sessions", {
                method: "POST",
                body: JSON.stringify({ username: formData.get("username"), password: formData.get("password") })
            });

            switch (res.status) {
                case 200:
                    generateSidebarByRole((await res.json()).role)
                    break;

                case 404:
                case 401:
                    document.getElementById("subtitle").innerText = "Error: Invalid credentials. Please enter your username and password again."
                    loginCalled = false;
                    break;

                case 403:
                    document.getElementById("subtitle").innerText = "Error: Unpermitted user."
                    loginCalled = false;
                    break;
            }
        }
    </script>
</body>

</html>
