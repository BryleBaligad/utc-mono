<!DOCTYPE html>
<html lang="en">
<style>
    .page-content {
        padding-top: 16px;
        padding-left: 12px;
        padding-right: 32px;
    }
    
    .bigtext {
        font-size: x-large;
        font-weight: bold;
    }

    .mediumtext {
        font-size: medium;
        font-weight: bold;
    }

    .kepi {
        display: inline-grid;
        grid-template-columns: 32px auto;
        background-color: beige;
        border: 1px solid lightgray;
        place-items: center;
    }

    .kepi img {
        width: 32px;
        height: 32px;
        padding: 4px 0 4px 16px;
    }

    .kepi > span {
        padding: 4px 16px 4px 16px;
    }
</style>

<body>
    <div class="page-content">
        <span class="bigtext">Home</span>
        <br>
        <span>
            <p>
                <div class="kepi">
                    <img src="/assets/icons/silk-svg/User.svg"> 
                    <span>
                        <span id="customerAccountCount">0</span> 
                        Customer Accounts
                    </span>
                </div>
                <div class="kepi">
                    <img src="/assets/icons/silk-svg/Car.svg"> 
                    <span>
                        <span id="vehicleCount">0</span> 
                        Vehicles
                    </span>
                </div>
                <br>
                <div class="kepi">
                    <img src="/assets/icons/silk-svg/Map edit.svg"> 
                    <span>
                        <span id="uncheckedTripCount">0</span> 
                        Unchecked Trips
                    </span>
                </div>
                <div class="kepi">
                    <img src="/assets/icons/silk-svg/Map.svg"> 
                    <span>
                        <span id="confirmedTripCount">0</span> 
                        Confirmed Trips
                    </span>
                </div>
                <div class="kepi">
                    <img src="/assets/icons/silk-svg/Map go.svg"> 
                    <span>
                        <span id="completedTripCount">0</span> 
                        Completed Trips
                    </span>
                </div>
            </p>
        </span>
        <br><br>
        <span class="mediumtext"></span>
    </div>
    <script>
    </script>
</body>

</html>
