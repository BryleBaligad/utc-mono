<!DOCTYPE html>
<html lang="en">
<style>
    .page-content {
        padding-top: 16px;
        padding-left: 12px;
        padding-right: 32px;
    }
    
    .bigtext {
        font-size: x-large;
        font-weight: bold;
    }

    .mediumtext {
        font-size: medium;
        font-weight: bold;
    }

    .tinytext {
        font-size: x-small;
    }

    .kepi {
        display: inline-grid;
        grid-template-columns: 32px auto;
        background-color: beige;
        border: 1px solid lightgray;
        place-items: center;
    }

    .kepi img {
        width: 32px;
        height: 32px;
        padding: 4px 0 4px 16px;
    }

    .kepi > span {
        padding: 4px 16px 4px 16px;
    }
</style>

<body>
    <div class="page-content">
        <span class="bigtext">Home</span> &nbsp; 
        <button class="action" onmousedown="load()">
            <img class="action-icon" src="/assets/icons/silk-svg/Arrow Rotate CW.svg"><span>Refresh</span>
        </button><br><br>
        <span>
            <div style="width: fit-content">
                <center>
                    <div class="kepi">
                        <img src="/assets/icons/silk-svg/User.svg"> 
                        <span>
                            <span id="customerAccountCount">0</span> 
                            Customer Account<span id="customerPlural">s</span>
                        </span>
                    </div>
                    <div class="kepi">
                        <img src="/assets/icons/silk-svg/Car.svg"> 
                        <span>
                            <span id="vehicleCount">0</span> 
                            Vehicle<span id="vehiclePlural">s</span>
                        </span>
                    </div>
                    <br>
                    <div class="kepi">
                        <img src="/assets/icons/silk-svg/Map edit.svg"> 
                        <span>
                            <span id="uncheckedTripCount">0</span> 
                            Unchecked Trip<span id="uncheckedPlural">s</span>
                        </span>
                    </div>
                    <div class="kepi">
                        <img src="/assets/icons/silk-svg/Map.svg"> 
                        <span>
                            <span id="confirmedTripCount">0</span> 
                            Confirmed Trip<span id="confirmedPlural">s</span>
                        </span>
                    </div>
                    <div class="kepi">
                        <img src="/assets/icons/silk-svg/Map go.svg"> 
                        <span>
                            <span id="completedTripCount">0</span> 
                            Completed Trip<span id="completedPlural">s</span>
                        </span>
                    </div>
                </center>
            </d>
        </span>
        <br><br>
        <span class="mediumtext">Recent Trips</span>
        <span class="tinytext">Use the trips page to edit details</span>
        <table id="tripsTable">
            <tr>
                <th>Trip ID</th>
                <th>Created</th>
                <th>Status</th>
                <th>Booking Detail</th>
                <th>Start</th>
                <th>End</th>
                <th>Customer</th>
            </tr>
        </table>
    </div>
    <script>
        function load() {
            fetch("/api/v1/misc?homekpi").then(res => {
                res.json().then(json => {
                    customerAccountCount.innerText = json.customer
                    customerPlural.innerText = json.customer != 1 ? "s" : ""
                    vehicleCount.innerText = json.vehicle
                    vehiclePlural.innerText = json.vehicle != 1 ? "s" : ""
                    uncheckedTripCount.innerText = json.unchecked
                    uncheckedPlural.innerText = json.unchecked != 1 ? "s" : ""
                    confirmedTripCount.innerText = json.confirmed
                    confirmedPlural.innerText = json.confirmed != 1 ? "s" : ""
                    completedTripCount.innerText = json.completed
                    completedPlural.innerText = json.completed != 1 ? "s" : ""
                })
            })
    
            fetch("/api/v1/trips?created").then(res => {
                document.querySelectorAll("#tripsTable > :not(:first-child)").forEach(element => element.remove())

                res.json().then(async json => {
                    for (let i = 0; i < json.length; i++) {
                        const trip = json[i];
                        await addTripsToTableRow(trip.id, trip.created_at, trip.status, trip.booking_type, trip.service_type, trip.service_subtype, trip.start_at, trip.end_at, trip.start_location || "", trip.end_location || "", trip.account_id)
                    }
                })
            })
        }

        async function addTripsToTableRow(id, createdAt, status, bookingType, serviceType, serviceSubtype, startAt, endAt, startLocation, endLocation, accountID) {
            let tripsTable = document.getElementById("tripsTable");
            let row = document.createElement("tr");

            let idCell = document.createElement("td");
            idCell.innerText = id;

            let createdAtCell = document.createElement("td");
            createdAtCell.innerText = new Date(parseInt(createdAt)).toLocaleString("sv");

            let statusCell = document.createElement("td");
            statusCell.innerText = status;
            switch (status) {
                case "NEGOTIATING": statusCell.style.backgroundColor = "#00c3ff"; break;
                case "ACTIVE": statusCell.style.backgroundColor = "yellow"; break;
                case "CONFIRMED": statusCell.style.backgroundColor = "yellow"; break;
                case "COMPLETED": statusCell.style.backgroundColor = "lime"; break;
                case "CANCELLED": statusCell.style.backgroundColor = "red"; break;
            }

            let bookingDetailCell = document.createElement("td");
            bookingDetailCell.innerText = `${bookingType}\n${serviceType}\n${serviceSubtype}`;

            let startDetailCell = document.createElement("td");
            startDetailCell.innerText = `${startLocation}\n${startAt ? new Date(startAt).toLocaleString("en-US").replace(", ", "\n") : ""}`;

            let endDetailCell = document.createElement("td");
            endDetailCell.innerText = `${endLocation}\n${endAt ? new Date(endAt).toLocaleString("en-US").replace(", ", "\n") : ""}`;

            let accountCell = document.createElement("td");
            if (!accountID) {
                accountCell.innerText = "None"
            } else {
                accountCell.title = "Account ID " + accountID
                let customer = await (await fetch(`/api/v1/accounts/${accountID}`)).json()
                if (customer.account_details) {
                    accountCell.innerText = `${customer.account_details.first_name} ${customer.account_details.middle_name} ${customer.account_details.last_name}\n${customer.account_details.mobile_number}`;
                    accountCell.style.textDecoration = "underline dotted"
                } else {
                    accountCell.innerText = `Account ID ${customer.id}`;
                }
            }

            row.append(idCell, createdAtCell, statusCell, bookingDetailCell, startDetailCell, endDetailCell, accountCell);

            tripsTable.append(row);
        }
    </script>
</body>

</html>
